spring.application.name=PTicketing

# Railway/Render inject PORT and route to it; ignoring it means the platform
# health-checks a port nothing is listening on.
server.port=${PORT:8080}
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

# ─────────────────────────────────────────────────────────────────────────────
# NO SECRETS IN THIS FILE. It is tracked in a public repository.
#
# Every credential below reads from an environment variable with no fallback, so
# a missing value fails loudly instead of silently using someone's leaked one.
# For local work put real values in application-local.properties (git-ignored)
# and run with --spring.profiles.active=local. For deployment set env vars on the
# platform.
# ─────────────────────────────────────────────────────────────────────────────

# Database — defaults to a local MySQL, overridden entirely by the local profile
# (which targets Supabase Postgres) or by env vars in deployment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Dialect intentionally unset: Hibernate 7 detects it from the connection and
# warns (HHH90000025) when told explicitly. Pinning MySQLDialect here also leaked
# into any profile that switches the datasource to another database.
spring.jpa.properties.hibernate.format_sql=true

# JWT — signs every auth token (HS256). A published value lets anyone forge a
# token for any user id, so this must never be committed and must be rotated if
# it ever has been. Rotating invalidates existing sessions; users re-login.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cloudinary — unused. QR hosting moved to Supabase Storage (see below); the bean
# stays for any future flyer uploads.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Paystack — the secret key is account-level API access: it can read every
# transaction and customer record, and issue refunds without OTP. Treat a leak as
# a compromised account, not a rotated password.
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.public-key=${PAYSTACK_PUBLIC_KEY:}

# Mail — plain SMTP, so any provider works by changing these values alone.
#   Gmail  : host smtp.gmail.com, username = the address, password = an App
#            Password (not the account password; requires 2-Step Verification)
#   Resend : host smtp.resend.com, username = the literal "resend",
#            password = the API key
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# The address recipients see. Separate from the SMTP login because relays such as
# Resend authenticate with a fixed literal username, which is not a valid sender.
#
# The fallback belongs here, not in @Value: this property is always defined, so a
# default on the injection point would never fire and a Gmail setup that sets only
# MAIL_USERNAME would end up with an empty sender and silently send nothing.
# Accepts a bare address or a display form: Eventify <tickets@example.com>
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Where replies go. Ticket emails invite questions, and sending from an address
# nobody monitors means those bounce. Unset means replies follow the From address.
mail.reply-to=${MAIL_REPLY_TO:}

# App Base URL
app.base-url=${APP_BASE_URL:http://localhost:8080}

# First admin account, ensured to exist on startup. Left unset means no admin is
# created or touched automatically — set both before relying on this to log in.
admin.bootstrap.email=${ADMIN_EMAIL:}
admin.bootstrap.password=${ADMIN_PASSWORD:}
admin.bootstrap.name=${ADMIN_NAME:Admin}

# Frontend URL — Paystack redirects the buyer to <frontend.url>/payment/success
# after checkout. Left as localhost in deployment, real buyers land on a dead
# address holding a paid-for ticket they cannot see.
frontend.url=${FRONTEND_URL:http://localhost:5173}

# CORS allowed origins (comma-separated). Must include the deployed frontend
# origin or the browser blocks every API call.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:3001}

# ── External sales channels (Brandible WhatsApp) ─────────────────────────────
# Shared secret required in X-Service-Key on /api/v1/integration/**.
# Left blank on purpose: with no value the integration endpoints stay closed.
integration.service-key=${INTEGRATION_SERVICE_KEY:}

# How long an unpaid external order keeps its seats before they go back on sale.
# Should be >= the checkout session TTL on the channel side (currently 30 min).
integration.hold-minutes=${INTEGRATION_HOLD_MINUTES:30}
integration.hold-sweep-ms=${INTEGRATION_HOLD_SWEEP_MS:300000}

# How long after an event ends the organiser's share becomes withdrawable.
integration.payout-hold-hours=${INTEGRATION_PAYOUT_HOLD_HOURS:24}

# How often to sweep for cashout requests an admin hasn't responded to within the SLA.
integration.payout-sla-sweep-ms=${INTEGRATION_PAYOUT_SLA_SWEEP_MS:1800000}

# A transfer waiting on its Paystack OTP past this many hours nags the admins:
# enter it, resend it, or force-fail the payout from the admin panel.
integration.payout-otp-stale-hours=${INTEGRATION_PAYOUT_OTP_STALE_HOURS:2}

# Where to POST issued tickets so the channel can deliver them (WhatsApp).
integration.delivery.webhook-url=${INTEGRATION_DELIVERY_WEBHOOK_URL:}
integration.delivery.api-key=${INTEGRATION_DELIVERY_API_KEY:}

# Replays channel delivery for paid orders whose message may have failed:
# sweep interval, minimum age (the original attempt plus retries finish inside
# a minute) and maximum age (past it, a human decides rather than a timer).
integration.delivery.reconcile-ms=${INTEGRATION_DELIVERY_RECONCILE_MS:900000}
integration.delivery.reconcile-min-age-minutes=${INTEGRATION_DELIVERY_RECONCILE_MIN_AGE_MINUTES:10}
integration.delivery.reconcile-max-hours=${INTEGRATION_DELIVERY_RECONCILE_MAX_HOURS:48}

# Buyers who arrive by phone have no email; one is derived using this domain.
integration.placeholder-email-domain=${INTEGRATION_PLACEHOLDER_EMAIL_DOMAIN:tickets.eventify.ng}

# ── QR image hosting (Supabase Storage) ──────────────────────────────────────
# Public bucket holding one PNG per ticket, for channels that send messages
# rather than email. Unset means tickets are delivered as a code in text, which
# is still a valid ticket — the scanner checks the code, not the image.
storage.supabase.url=${STORAGE_SUPABASE_URL:}
storage.supabase.service-key=${STORAGE_SUPABASE_SERVICE_KEY:}
storage.supabase.bucket=${STORAGE_SUPABASE_BUCKET:tickets}

# ── QR code signing ──────────────────────────────────────────────────────────
# HMAC-SHA256 key binding every ticket code to its event
# (V1.<event>.<nonce>.<hmac>). A leaked code is then worthless outside the
# event it was minted for. Unset means new codes fall back to unsigned random
# UUIDs with a startup warning; set this before going live.
# Rotating it invalidates nothing already scanned but makes codes minted under
# the old key fail signature checks once they leave legacy grace.
qr.signing-secret=${QR_SIGNING_SECRET:}
