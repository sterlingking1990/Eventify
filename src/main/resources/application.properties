spring.application.name=PTicketing

server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/eventify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=emmanuel123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=pticketing-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256
app.jwt.expiration-ms=86400000

# Cloudinary
cloudinary.cloud-name=your-cloud-name
cloudinary.api-key=your-api-key
cloudinary.api-secret=your-api-secret

# Paystack
paystack.secret-key=sk_test_xxxxxxxxxxxxxxxxxxxx
paystack.public-key=pk_test_xxxxxxxxxxxxxxxxxxxx

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App Base URL
app.base-url=http://localhost:8080
