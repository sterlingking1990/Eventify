# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod on the platform.
#
# COMMITTED AND PUBLIC — contains no secrets. Every credential still comes from
# the environment variables declared in application.properties. This file only
# holds the settings that differ structurally between local MySQL and a deployed
# Postgres, which cannot be expressed as a safe default in the base file.

# ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver

# The single most important line here. Eventify's tables live in their own schema,
# not public. Omit this and Hibernate targets public — with ddl-auto=update it
# would create a second, empty set of all 12 tables there while the real data sits
# untouched in `eventify`. The app starts cleanly and shows zero events, which is
# a far more confusing failure than a crash.
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:eventify}

# `validate` rather than `update`: Hibernate should never alter a production
# schema on boot. Startup fails loudly if entities and tables disagree, which is
# the signal to write a migration. Override with DDL_AUTO=update only knowingly.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false

# Supabase's connection pooler caps connections per project, and a container that
# grabs a large pool starves everything else sharing it.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=15000

# ── Logging ──────────────────────────────────────────────────────────────────
# Payment and fulfilment paths log at INFO and those lines are the audit trail
# when a buyer says they paid and got nothing.
logging.level.com.example.PTicketing=INFO
logging.level.org.hibernate.SQL=WARN
